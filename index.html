<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#05070a" />
<title>未来考古机</title>
<style>
:root{--bg:#05070a;--panel:rgba(255,255,255,.055);--line:rgba(255,255,255,.09);--text:#eef4f7;--muted:#8e9aa4;--accent:#a7ffd9}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -20%,rgba(70,255,190,.12),transparent 40%),linear-gradient(#05070a,#070a0d 60%,#040506);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}body{min-height:100svh;display:flex;justify-content:center}.app{width:min(100%,540px);min-height:100svh;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 22px);display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:12px;letter-spacing:.22em;color:var(--muted)}.status{font-size:11px;color:var(--accent)}.hero{padding:18px 0 12px}h1{font-size:34px;line-height:1.05;margin:0 0 8px;font-weight:720;letter-spacing:-.03em}.sub{color:var(--muted);font-size:14px;line-height:1.6}.card{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(14px);box-shadow:0 20px 70px rgba(0,0,0,.28)}.meta{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--muted);letter-spacing:.08em}.artifact{font-size:18px;margin:20px 0 8px;color:var(--accent)}.report{font-size:19px;line-height:1.9;min-height:210px;white-space:pre-line}.footnote{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6}.controls{margin-top:auto;padding-top:18px}button{width:100%;border:0;border-radius:18px;padding:17px 18px;font-size:16px;font-weight:700;background:var(--accent);color:#03120d;-webkit-tap-highlight-color:transparent}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:600}.history{display:none;margin-top:14px;padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.035);max-height:220px;overflow:auto}.history.show{display:block}.hitem{font-size:12px;line-height:1.5;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.08)}.tiny{margin-top:12px;text-align:center;color:#59636b;font-size:10px}.blink{animation:blink .22s ease}@keyframes blink{50%{filter:brightness(1.5)}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="brand">FUTURE ARCHAEOLOGY UNIT</div><div class="status">● 在线挖掘</div></div>
<section class="hero"><h1>未来考古机</h1><div class="sub">让未来的人类，误解今天的一切。</div></section>
<section class="card" id="card"><div class="meta"><span id="year">公元 2178 年</span><span id="case">档案 #0001</span></div><div class="artifact" id="artifact">出土物：汽车钥匙</div><div class="report" id="report">考古人员认为，这是一种远古交通工具的“实体授权令牌”。\n\n令人困惑的是，人类当时必须随身携带它，才能证明自己有资格使用自己购买的机器。\n\n部分研究者怀疑，这可能与早期人类对“安全感”的原始崇拜有关。</div><div class="footnote" id="footnote">可信度：38% · 仍有 2 名学者坚持认为它其实是一种求偶饰品。</div></section>
<div class="controls"><button id="dig">发掘一次</button><div class="row"><button class="ghost" id="weird">提高误解程度</button><button class="ghost" id="historyBtn">出土档案</button></div><div class="history" id="history"></div><div class="tiny">ERDAN LAB · 不联网 · 记录仅保存在当前浏览器</div></div>
</div>
<script>
const artifacts=[["手机壳","一种用于保护珍贵矩形圣物的外骨骼。","学者至今无法解释，为什么圣物更新后外骨骼通常也必须一起更换。"],["充电线","远古人类为电子器官输送能量的脐带。","考古现场常发现大量相互缠绕的脐带，推测当时存在严重的人工繁殖问题。"],["汽车钥匙","远古交通工具的实体授权令牌。","有人认为它也承担身份象征功能，因此尺寸越大可能代表社会地位越高。"],["外卖袋","城市居民用于接收热量补给的软质运输舱。","遗迹显示，人类频繁支付额外费用让陌生人把食物送到距离自己几十米的位置。"],["耳机","一种主动隔绝同类声音的双耳装置。","这说明早期城市人口密度可能高到令人无法忍受。"],["鼠标","一种驯化桌面指针的机械啮齿类替代物。","后期版本甚至不再具有尾巴，表明人工驯化已非常成熟。"],["二维码","二维视觉咒语。","古人会主动把镜头对准它，并期待现实世界因此发生变化。"],["工牌","企业部落的胸前身份铭牌。","考古学家认为部分人每天必须佩戴它才能进入自己的工作场所。"],["U盘","便携式记忆胶囊。","大量遗物标注‘最终版’‘最终版2’‘真最终版’，其宗教含义仍未知。"],["共享充电宝","公共电子续命器。","古人会短暂租用电池，并因忘记归还而支付远超其价值的费用。"],["雨伞","手持式局部天气防御装置。","令人费解的是，人类经常在最需要它时发现自己并未携带。"],["咖啡杯","劳动社会常见的合法兴奋剂容器。","不少研究者认为它与生产效率崇拜存在直接关系。"],["自拍杆","用于增加自我观察距离的金属延伸肢体。","这可能证明21世纪人类已无法忍受只从自然视角看见自己。"],["机械键盘","用于制造文字及噪音的桌面仪式器械。","越昂贵的型号，往往越执着于模拟更古老的机械触感。"]];
const openings=["主流观点认为，","目前最荒谬但支持率最高的理论是，","根据第七次复原实验，","考古委员会暂时认定，","一份被严重损坏的论坛记录显示，"];
const endings=["该结论遭到年轻学者嘲笑，但没人能提出更好的解释。","此观点已连续 12 年占据教材，但证据依然十分可疑。","研究团队因此获得了当年的‘最大胆误读奖’。","目前仍有少数保守派坚持它只是普通生活用品。","这一发现再次证明：未来人类也不一定比古人聪明。"];
let weirdness=Number(localStorage.getItem('future_weirdness')||1);let count=Number(localStorage.getItem('future_count')||1);const rnd=a=>a[Math.floor(Math.random()*a.length)],pad=n=>String(n).padStart(4,'0');
function renderHistory(){const box=document.getElementById('history');const h=JSON.parse(localStorage.getItem('future_history')||'[]');box.innerHTML=h.length?h.map(x=>`<div class="hitem"><b>公元 ${x.year} · ${x.name}</b><br>${x.report.split('\n')[0]}</div>`).join(''):'<div class="hitem">尚未发现历史遗物。</div>'}
function updateWeird(){document.getElementById('weird').textContent=weirdness===1?'提高误解程度':weirdness===2?'误解：可疑':weirdness===3?'误解：离谱':'误解：未来人疯了'}
function makeReport(){count++;localStorage.setItem('future_count',count);const a=rnd(artifacts),year=2140+Math.floor(Math.random()*360);let extra='';if(weirdness>=2)extra+='\n\n'+rnd(openings)+'这件物品很可能与某种已经失传的社会等级制度有关。';if(weirdness>=3)extra+='\n\n更极端的学派甚至认为，它不是工具，而是早期算法社会用来训练人类行为的诱饵。';if(weirdness>=4)extra+='\n\n一名匿名研究员留下批注：『也许他们知道这一切很荒谬，只是还是每天照做。』';const report=`${rnd(openings)}“${a[0]}”是${a[1]}\n\n${a[2]}${extra}\n\n${rnd(endings)}`;const conf=Math.max(9,Math.min(91,64-weirdness*8+Math.floor(Math.random()*29)-14));document.getElementById('year').textContent=`公元 ${year} 年`;document.getElementById('case').textContent=`档案 #${pad(count)}`;document.getElementById('artifact').textContent=`出土物：${a[0]}`;document.getElementById('report').textContent=report;document.getElementById('footnote').textContent=`可信度：${conf}% · 误解等级 ${weirdness}/4`;const h=JSON.parse(localStorage.getItem('future_history')||'[]');h.unshift({year,name:a[0],report});localStorage.setItem('future_history',JSON.stringify(h.slice(0,20)));const card=document.getElementById('card');card.classList.remove('blink');void card.offsetWidth;card.classList.add('blink');renderHistory()}
document.getElementById('dig').addEventListener('click',makeReport);document.getElementById('weird').addEventListener('click',()=>{weirdness=weirdness>=4?1:weirdness+1;localStorage.setItem('future_weirdness',weirdness);updateWeird()});document.getElementById('historyBtn').addEventListener('click',()=>{document.getElementById('history').classList.toggle('show');renderHistory()});updateWeird();renderHistory();
</script>
</body>
</html>
