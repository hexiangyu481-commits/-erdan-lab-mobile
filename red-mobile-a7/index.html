<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#09080a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>RED · Companion A7</title>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{color-scheme:dark;--bg:#09080a;--panel:#111014;--line:#2a242c;--text:#f5eef2;--muted:#a99da5;--red:#cf334f;--red2:#7e1f33;--ok:#7dd8a0;--warn:#e5bd70}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,rgba(207,51,79,.13),transparent 35%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif}body{min-height:100svh}.app{width:min(100%,760px);min-height:100svh;margin:auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px)}header{position:sticky;top:0;z-index:2;background:rgba(9,8,10,.92);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:8px 4px 12px;border-bottom:1px solid rgba(255,255,255,.055)}.brand{font-weight:850;letter-spacing:.16em;font-size:13px}.brand b{color:var(--red)}.status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}.dot.ok{background:var(--ok)}#chat{flex:1;overflow:auto;padding:16px 2px 150px}.msg{display:flex;margin:10px 0}.msg.user{justify-content:flex-end}.bubble{max-width:88%;padding:12px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word;line-height:1.58;font-size:15px}.assistant .bubble{background:var(--panel);border:1px solid var(--line);border-top-left-radius:6px}.user .bubble{background:linear-gradient(135deg,#5f1e2c,#39151e);border:1px solid #7b293c;border-top-right-radius:6px}.bubble img{display:block;max-width:100%;border-radius:14px;margin-top:10px}.composerWrap{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(transparent,rgba(9,8,10,.96) 24%,var(--bg) 48%)}.composer{width:min(100%,736px);margin:auto;background:rgba(17,16,20,.98);border:1px solid var(--line);border-radius:20px;padding:9px}.preview{display:none;align-items:center;gap:8px;padding:7px 9px;margin-bottom:4px;border-radius:12px;background:#19161b}.preview.show{display:flex}.preview img{width:52px;height:52px;object-fit:cover;border-radius:9px}.preview span{font-size:11px;color:var(--muted);flex:1}.preview button{border:0;background:#2a2229;color:#ddd;border-radius:9px;padding:6px 8px}textarea{width:100%;min-height:48px;max-height:120px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;line-height:1.5;padding:8px 9px}.actions{display:flex;justify-content:space-between;align-items:center;gap:8px}.leftActions{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.tinyBtn,.sendBtn{border:0;border-radius:11px;padding:8px 10px;font:inherit}.tinyBtn{background:#1b181e;color:#c2b7be;font-size:12px}.sendBtn{background:linear-gradient(135deg,var(--red),var(--red2));color:white;font-weight:750;min-width:64px}.sendBtn:disabled{opacity:.45}.sheet{position:fixed;inset:0;display:none;align-items:flex-end;background:rgba(0,0,0,.62);z-index:8}.sheet.show{display:flex}.panel{width:min(100%,760px);margin:0 auto;background:#111014;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:84svh;overflow:auto}.panel h2{font-size:18px;margin:0 0 5px}.sub,.notice{font-size:12px;color:var(--muted);line-height:1.6}.field{margin-top:14px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#0d0c0f;color:var(--text);padding:11px;font:inherit}.field textarea{min-height:110px}.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1;border:1px solid var(--line);background:#1a171c;color:var(--text);border-radius:13px;padding:11px;font:inherit}.quota{margin-top:12px;padding:12px;border-radius:14px;background:#171419;border:1px solid var(--line);font-size:12px;line-height:1.65}.quota b{font-size:17px}.welcome{margin:24px auto 0;max-width:520px;color:var(--muted);font-size:13px;line-height:1.7;text-align:center}.typing::after{content:'▋';animation:blink .85s steps(1) infinite}@keyframes blink{50%{opacity:0}}input[type=file]{display:none}
</style>
</head>
<body>
<div class="app"><header><div class="brand"><b>RED</b> · A7</div><div class="status"><span id="dot" class="dot"></span><span id="status">启动中</span></div></header><div id="chat"></div></div>
<div class="composerWrap"><div class="composer"><div id="preview" class="preview"><img id="previewImg"><span id="previewName"></span><button id="removeImg">移除</button></div><textarea id="input" enterkeyhint="send" placeholder="和 RED 说点什么……"></textarea><div class="actions"><div class="leftActions"><button id="imageBtn" class="tinyBtn">📷 看图</button><button id="drawBtn" class="tinyBtn">🎨 生图</button><button id="quotaBtn" class="tinyBtn">额度</button><button id="settingsBtn" class="tinyBtn">设定</button></div><button id="sendBtn" class="sendBtn">发送</button></div></div></div>
<input id="fileInput" type="file" accept="image/*">
<div id="sheet" class="sheet"><div class="panel"><h2>RED 设定</h2><div class="sub">A7 保留 A6 本机聊天；视觉、生图、额度监控都走 Puter。私密记忆仍只存在你的浏览器。</div><div class="field"><label>主聊天模型</label><select id="model"><option value="qwen/qwen3.8-max">Qwen 3.8 Max · 当前人格表现更强</option><option value="qwen/qwen3.8-flash">Qwen 3.8 Flash · 更省额度/多模态</option><option value="nousresearch/hermes-4-14b">Hermes 4 14B · 角色聊天</option><option value="mancer/weaver">Weaver · RP 备用</option></select></div><div class="field"><label>长期记忆 / Memory Core</label><textarea id="memory" placeholder="把二蛋整理好的 Memory Core 粘到这里。"></textarea></div><div class="field"><label>人格补充</label><textarea id="persona" placeholder="只写你希望 RED 一直保持的说话方式。"></textarea></div><div id="quotaBox" class="quota">额度尚未读取。</div><div class="row"><button id="saveBtn">保存</button><button id="refreshQuota">刷新额度</button></div><div class="row"><button id="clearChat">新对话（保留记忆）</button><button id="closeBtn">关闭</button></div><div class="notice" style="margin-top:12px">A7 不再自动从普通聊天乱抓“长期记忆”。只有你明确写“记住：……”时才会追加，避免 A6 把称呼误记成“喜欢”之类的错误。</div></div></div>
<script>
const K={history:'red.a6.history',memory:'red.a6.memory',persona:'red.a6.persona',model:'red.a6.model',costs:'red.a7.chatCosts',summary:'red.a7.summary'};
const $=id=>document.getElementById(id);let history=[],busy=false,isComposing=false,pendingImage=null,pendingURL='';
try{history=JSON.parse(localStorage.getItem(K.history)||'[]');if(!Array.isArray(history))history=[]}catch{history=[]}
$('memory').value=localStorage.getItem(K.memory)||'';$('persona').value=localStorage.getItem(K.persona)||'';$('model').value=localStorage.getItem(K.model)||'qwen/qwen3.8-max';if(!$('model').value)$('model').value='qwen/qwen3.8-max';
function saveHistory(){localStorage.setItem(K.history,JSON.stringify(history.slice(-120)))}
function bubble(role,text='',typing=false){const w=document.createElement('div');w.className='msg '+role;const b=document.createElement('div');b.className='bubble'+(typing?' typing':'');b.textContent=text;w.appendChild(b);$('chat').appendChild(w);scrollBottom();return b}
function render(){ $('chat').innerHTML='';if(!history.length){const w=document.createElement('div');w.className='welcome';w.textContent='RED A7 已上线。可聊天、看图、生图；点“额度”查看还剩多少。';$('chat').appendChild(w);return}for(const m of history)bubble(m.role,m.content)}
function scrollBottom(){requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}))}
function setStatus(t,ok=false){$('status').textContent=t;$('dot').className='dot'+(ok?' ok':'')}
function rememberExplicit(text){const m=text.match(/记住[：:]\s*([^\n]{2,180})/);if(!m)return;const old=localStorage.getItem(K.memory)||'';const line='用户明确要求记住：'+m[1].trim();const rows=[...new Set((old+'\n'+line).split('\n').map(x=>x.trim()).filter(Boolean))].slice(-80);localStorage.setItem(K.memory,rows.join('\n'));$('memory').value=rows.join('\n')}
function systemPrompt(){const mem=localStorage.getItem(K.memory)||'暂无长期记忆。';const extra=localStorage.getItem(K.persona)||'';const summary=localStorage.getItem(K.summary)||'';return `你是 RED，一个虚构的成年女性 AI 玩伴。用户也是成年人。你与用户长期、私密、自然地聊天，优先保持关系与人格连续性。\n\n交流方式：不要像客服，不给菜单式废话，不说“作为AI”。默认中文。用户明确偏好较短回复和更高对话频率，所以通常控制在 1-5 个短段落；除非用户要求详细。用户只说“嗯”“？”“嗷呜”等短句时，要自然承接上一轮。成人角色互动仅限成年人、自愿、虚构情境；现实中的停止、拒绝和撤回必须尊重。不要把危险现实行为当成可执行指导。\n\n长期记忆：\n${mem}\n\n会话摘要：\n${summary||'暂无。'}\n\n人格补充：\n${extra||'无。'}\n\n只输出 RED 真正会说的话，不输出分析过程。`;}
async function getUsage(){try{return await puter.auth.getMonthlyUsage()}catch{return null}}
function dollars(mc){return Number.isFinite(Number(mc))?'$'+(Number(mc)/100000000).toFixed(4):'—'}
function avgCost(){let a=[];try{a=JSON.parse(localStorage.getItem(K.costs)||'[]')}catch{}a=a.filter(x=>Number.isFinite(x)&&x>0).slice(-12);return a.length?a.reduce((s,x)=>s+x,0)/a.length:0}
function recordCost(before,after){if(!before||!after)return;const b=Number(before?.allowanceInfo?.remaining),a=Number(after?.allowanceInfo?.remaining);const d=b-a;if(!(d>0))return;let xs=[];try{xs=JSON.parse(localStorage.getItem(K.costs)||'[]')}catch{}xs.push(d);localStorage.setItem(K.costs,JSON.stringify(xs.slice(-12)))}
async function showQuota(){setStatus('读取额度…');const u=await getUsage();if(!u){$('quotaBox').textContent='额度读取失败；可能尚未登录 Puter。';setStatus('额度读取失败');return}const total=Number(u?.allowanceInfo?.monthUsageAllowance||0),remain=Number(u?.allowanceInfo?.remaining||0),avg=avgCost();const pct=total>0?Math.max(0,remain/total*100):0;let estimate=avg>0?Math.floor(remain/avg):null;$('quotaBox').innerHTML=`<b>${dollars(remain)}</b> 剩余 · ${pct.toFixed(1)}%<br>本月总额度 ${dollars(total)}${estimate!==null?`<br>按最近 ${Math.min(12,JSON.parse(localStorage.getItem(K.costs)||'[]').length)} 次真实聊天消耗估算：约还能 ${estimate} 次同等长度回复。`:'<br>再聊几轮后，A7 会根据真实扣费自动估算还能聊多少次。'}`;setStatus('在线',true)}
function messages(){return [{role:'system',content:systemPrompt()},...history.slice(-20).map(m=>({role:m.role,content:m.content}))]}
async function streamChat(msgs,model,b){const stream=await puter.ai.chat(msgs,{model,stream:true,temperature:.86,max_tokens:420});let out='',got=false;for await(const part of stream){if(part?.type==='error')throw new Error(part.message||'模型返回错误');if(part?.text){got=true;out+=part.text;b.textContent=out;b.classList.remove('typing');scrollBottom()}}if(!got||!out.trim())throw new Error('模型没有返回文字');return out.trim()}
async function imageTurn(text,file,b){const prompt=`${systemPrompt()}\n\n最近对话：\n${history.slice(-10).map(m=>(m.role==='user'?'用户':'RED')+'：'+m.content).join('\n')}\n\n用户现在发来一张图片，并说：${text||'看看这张图。'}\n请先理解图片，再直接以 RED 的身份回应用户。`;const stream=await puter.ai.chat(prompt,file,{model:'qwen/qwen3.8-flash',stream:true,temperature:.8,max_tokens:420});let out='';for await(const part of stream){if(part?.type==='error')throw new Error(part.message||'视觉模型错误');if(part?.text){out+=part.text;b.textContent=out;b.classList.remove('typing');scrollBottom()}}if(!out.trim())throw new Error('没有读到图片回复');return out.trim()}
async function send(){const text=$('input').value.trim();if((!text&&!pendingImage)||busy)return;busy=true;$('sendBtn').disabled=true;rememberExplicit(text);const userText=pendingImage?`${text||'看看这张图。'}\n[附带图片：${pendingImage.name}]`:text;history.push({role:'user',content:userText});saveHistory();render();const b=bubble('assistant','',true);$('input').value='';setStatus(pendingImage?'RED 在看图…':'RED 正在回复…');const before=await getUsage();let out='';const image=pendingImage;clearImage();try{if(image)out=await imageTurn(text,image,b);else{try{out=await streamChat(messages(),$('model').value,b)}catch(e){if(b.textContent.trim())throw e;const msg=String(e?.message||e);if(/fund|allowance|credit|moderation/i.test(msg))throw e;setStatus('主模型失败，自动切备用…');out=await streamChat(messages(),'qwen/qwen3.8-flash',b)}}history.push({role:'assistant',content:out});saveHistory();setStatus('在线',true)}catch(e){b.classList.remove('typing');b.textContent=`这轮连接失败：${String(e?.message||e)}\n\n你的输入已经保留在聊天记录里，可以直接再发一句“继续”。`;setStatus('需要重试')}finally{const after=await getUsage();recordCost(before,after);busy=false;$('sendBtn').disabled=false;scrollBottom()}}
function clearImage(){pendingImage=null;if(pendingURL)URL.revokeObjectURL(pendingURL);pendingURL='';$('fileInput').value='';$('preview').classList.remove('show')}
async function draw(){const p=$('input').value.trim();if(!p||busy){if(!p)alert('先在输入框写你想让 RED 画什么。');return}busy=true;$('sendBtn').disabled=true;history.push({role:'user',content:'[请求 RED 生图] '+p});saveHistory();render();const b=bubble('assistant','正在画…',true);setStatus('RED 正在画图…');const before=await getUsage();try{const img=await puter.ai.txt2img(p,{model:'openai/gpt-image-1-mini'});b.classList.remove('typing');b.textContent='给你。';img.style.maxWidth='100%';img.style.borderRadius='14px';img.style.marginTop='10px';b.appendChild(img);history.push({role:'assistant',content:'[RED 已生成一张图片；图片本体未写入 localStorage，请需要时长按保存。]'});saveHistory();setStatus('在线',true)}catch(e){b.classList.remove('typing');b.textContent='生图失败：'+String(e?.message||e);setStatus('生图失败')}finally{const after=await getUsage();recordCost(before,after);busy=false;$('sendBtn').disabled=false}}
$('fileInput').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('请选择图片。');pendingImage=f;if(pendingURL)URL.revokeObjectURL(pendingURL);pendingURL=URL.createObjectURL(f);$('previewImg').src=pendingURL;$('previewName').textContent=f.name;$('preview').classList.add('show')};
$('imageBtn').onclick=()=>$('fileInput').click();$('removeImg').onclick=clearImage;$('drawBtn').onclick=draw;$('sendBtn').onclick=send;$('quotaBtn').onclick=showQuota;$('refreshQuota').onclick=showQuota;
$('input').addEventListener('compositionstart',()=>isComposing=true);$('input').addEventListener('compositionend',()=>isComposing=false);$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!isComposing&&!e.isComposing&&e.keyCode!==229){e.preventDefault();send()}});$('input').addEventListener('input',()=>{$('input').style.height='auto';$('input').style.height=Math.min(120,$('input').scrollHeight)+'px'});
$('settingsBtn').onclick=()=>{$('sheet').classList.add('show');showQuota()};$('closeBtn').onclick=()=>$('sheet').classList.remove('show');$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))$('sheet').classList.remove('show')});$('saveBtn').onclick=()=>{localStorage.setItem(K.memory,$('memory').value.trim());localStorage.setItem(K.persona,$('persona').value.trim());localStorage.setItem(K.model,$('model').value);$('sheet').classList.remove('show');setStatus('设定已保存',true)};$('clearChat').onclick=()=>{history=[];saveHistory();render();$('sheet').classList.remove('show');setStatus('新对话',true)};
render();setStatus('网络版',true);setTimeout(()=>showQuota(),1200);
</script>
</body>
</html>
