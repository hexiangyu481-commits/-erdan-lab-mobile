<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11101a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="EH 轻阅读"><title>EH 轻阅读 · LightReader</title><style>
:root{color-scheme:dark;--bg:#100f17;--card:#201e2b;--border:#353143;--fg:#f5f0ff;--muted:#a29eb7;--a:#ae99ff;--soft:#302943}html.light{color-scheme:light;--bg:#f8f7fd;--card:#fff;--border:#e1def0;--fg:#211c2e;--muted:#7e768d;--a:#7257d8;--soft:#eee9ff}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input,select{font:inherit}button{cursor:pointer}main,header{max-width:930px;margin:auto}header{padding:calc(18px + env(safe-area-inset-top)) 19px 23px;display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;gap:11px}.mark{width:43px;height:43px;background:linear-gradient(135deg,#b5a4ff,#6b54dc);border-radius:14px;display:grid;place-items:center;color:#fff;font-size:23px;font-weight:700}.logo b{font-size:16px}.logo small{display:block;letter-spacing:.18em;font-size:9px;color:var(--muted);padding-top:4px}.icon{background:var(--card);border:1px solid var(--border);border-radius:50%;color:var(--fg);width:41px;height:41px;font-size:21px}main{padding:0 19px 110px}.hero{padding:28px 25px;border-radius:25px;background:linear-gradient(120deg,#302747,#4d3c78);color:#fff;overflow:hidden;position:relative}.hero:before{content:'阅';position:absolute;right:-10px;top:-20px;font-size:200px;color:#ffffff09;font-weight:900;transform:rotate(-16deg)}.eyebrow{display:block;font-size:10px;font-weight:700;letter-spacing:.16em;color:#b9a8ff}.hero h1{position:relative;font-size:34px;line-height:1.3;margin:12px 0;letter-spacing:-.04em}.hero p{position:relative;color:#ddd4f3;font-size:12px;line-height:1.8;max-width:320px;margin:0}.find{display:flex;gap:8px;margin:20px 0 5px;background:var(--card);border:1px solid var(--border);padding:6px;border-radius:16px}.find input{min-width:0;flex:1;color:var(--fg);border:0;background:transparent;outline:0;padding:10px}.primary{background:#7d64e5;color:#fff;border:0;border-radius:11px;padding:12px 17px;font-size:12px;font-weight:700}.alt{background:var(--soft);color:var(--a);border:0;border-radius:11px;padding:11px 14px;font-size:12px}.h{display:flex;align-items:center;justify-content:space-between;margin:29px 0 13px}.h b{font-size:20px}.h small{font-size:11px;color:var(--muted)}.chips{display:flex;gap:9px;overflow-x:auto;padding:3px 0 7px}.chip{white-space:nowrap;border:1px solid var(--border);border-radius:12px;padding:10px 14px;background:var(--card);color:var(--muted);font-size:12px}.chip.on{background:var(--soft);border-color:var(--a);color:var(--a)}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{padding:18px;border-radius:17px;border:1px solid var(--border);background:var(--card);text-align:left;color:var(--fg);min-height:118px;display:flex;flex-direction:column;justify-content:space-between}.tile span{color:var(--a);font-size:25px}.tile b{font-size:14px}.note{background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:12px;line-height:1.8;padding:17px;border-radius:15px;margin-top:20px}.empty{text-align:center;padding:40px 21px;border:1px dashed var(--border);border-radius:20px;background:var(--card);margin-top:24px}.empty big{font-size:43px;color:var(--a)}.empty p{color:var(--muted);font-size:12px;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;margin-top:21px}.book{min-width:0}.cover{display:block;position:relative;aspect-ratio:3/4;background:linear-gradient(125deg,#45345c,#242230);border-radius:14px;overflow:hidden}.cover:after{content:'EH';position:absolute;inset:0;display:grid;place-items:center;color:#ffffff36;font-size:45px;font-weight:800}.cover img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover}.book strong{display:block;font-size:12px;line-height:1.5;margin-top:8px;overflow-wrap:anywhere}.book small{font-size:10px;color:var(--muted)}.book button{font-size:11px;color:var(--muted);background:transparent;border:0;padding:7px 0}.line{padding:18px;background:var(--card);border:1px solid var(--border);border-radius:17px;margin:12px 0}.line p{font-size:12px;line-height:1.75;color:var(--muted)}.line input,.line select{display:block;width:100%;padding:13px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:11px;margin:10px 0;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;background:var(--bg);border-top:1px solid var(--border);padding:9px 0 calc(10px + env(safe-area-inset-bottom));z-index:2}.tabs button{background:none;border:0;color:var(--muted);font-size:10px;display:flex;flex-direction:column;gap:3px;align-items:center;min-width:62px}.tabs button span{font-size:24px}.tabs .sel{color:var(--a)}@media(min-width:750px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}} 
</style></head><body><header><div class="logo"><div class="mark">阅</div><div><b>EH 轻阅读</b><small>LIGHTREADER · WEB</small></div></div><button id="theme" class="icon" aria-label="切换主题">☾</button></header><main id="main"></main><nav id="tabs" class="tabs"><button data-tab="discover" class="sel"><span>◈</span>发现</button><button data-tab="shelf"><span>▤</span>书架</button><button data-tab="history"><span>◷</span>历史</button><button data-tab="settings"><span>⚙</span>我的</button></nav><script>
(()=>{'use strict';const $=s=>document.querySelector(s),app=$('#main');const C=[['同人志',2,'✧'],['漫画',4,'▤'],['画师CG',8,'◉'],['游戏CG',16,'◇'],['图集',32,'▣'],['Cosplay',64,'♧'],['亚洲影像',128,'▥'],['非成人',256,'☼']];const T=[['中文','language:chinese$'],['日文','language:japanese$'],['英文','language:english$'],['全彩','other:full_color$'],['黑白','-other:full_color$']];const map={'#中文':'language:chinese$','#汉化':'language:chinese$','#日文':'language:japanese$','#英文':'language:english$','#全彩':'other:full_color$','#黑白':'-other:full_color$'};let tab='discover',query='',tags=[],host=localStorage.getItem('ehweb:host')||'https://e-hentai.org';const kv=n=>'ehrweb:v1:'+n;const read=n=>{try{const a=JSON.parse(localStorage.getItem(kv(n))||'[]');return Array.isArray(a)?a:[]}catch{return[]}};const save=(n,a)=>localStorage.setItem(kv(n),JSON.stringify(a.slice(0,100)));const valid=u=>{try{const a=new URL(u);return a.protocol==='https:'&&['e-hentai.org','exhentai.org'].includes(a.hostname)&&/^\/g\/\d+\/[a-z0-9]+\/?$/i.test(a.pathname)?a.origin+a.pathname.replace(/\/?$/,'/'):null}catch{return null}};const node=(name,cl,text)=>{const a=document.createElement(name);if(cl)a.className=cl;if(text!==undefined)a.textContent=text;return a};const btn=(text,fn,cl='alt')=>{const b=node('button',cl,text);b.onclick=fn;return b};const section=(title,tail)=>{const x=node('div','h');x.append(node('b','',title),node('small','',tail||''));app.append(x)};const urlFor=(cats=0)=>{const u=new URL(host);const s=(query+' '+tags.join(' ')).trim().replace(/(^|\s)(#[^\s]+)/g,(a,sp,k)=>sp+(map[k]||k));if(s)u.searchParams.set('f_search',s);if(cats)u.searchParams.set('f_cats',String(1023-cats));return u.href};function open(u){const a=node('a');a.href=u;a.target='_blank';a.rel='noopener noreferrer';document.body.append(a);a.click();a.remove()}function cards(rows,name){const grid=node('div','cards');rows.forEach((r,i)=>{const url=valid(r.url);if(!url)return;const book=node('div','book'),a=node('a','cover');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.onclick=()=>{const list=read('history');save('history',[r,...list.filter(x=>x.url!==r.url)])};if(typeof r.cover==='string'&&r.cover.startsWith('https://')){const img=node('img');img.src=r.cover;img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>img.remove();a.append(img)}book.append(a,node('strong','',String(r.title||'未命名作品').slice(0,200)),node('small','',String(r.category||'漫画').slice(0,32)));book.append(btn('移除',()=>{if(confirm('移除这条记录？')){save(name,read(name).filter(x=>x.url!==r.url));render()}},''));grid.append(book)});app.append(grid)}function empty(title,detail,action,fn){const e=node('div','empty');e.append(node('big','','▤'),node('h3','',title),node('p','',detail),btn(action,fn,'primary'));app.append(e)}function add(){const block=node('div','line');block.append(node('b','','添加作品链接'));const input=node('input');input.type='url';input.placeholder='https://e-hentai.org/g/123/token/';const title=node('input');title.placeholder='作品标题';block.append(input,title,btn('加入书架',()=>{const url=valid(input.value);if(!url)return alert('请输入有效的 E-Hentai / ExHentai 作品链接');const r={url,title:title.value.trim().slice(0,200)||'未命名作品',savedAt:Date.now()};save('shelf',[r,...read('shelf').filter(x=>x.url!==url)]);render()},'primary'));app.prepend(block)}function discover(){const hero=node('div','hero');hero.innerHTML='<span class="eyebrow">YOUR READING SPACE</span><h1>好故事，<br>从这里开始。</h1><p>漫画发现、中文标签与私人书架。<br>你的阅读空间，由你决定。</p>';app.append(hero);const search=node('form','find'),inp=node('input');inp.type='search';inp.placeholder='搜索标题、作者或 #中文 #全彩';inp.value=query;inp.oninput=()=>query=inp.value;search.onsubmit=e=>{e.preventDefault();open(urlFor())};const send=node('button','primary','搜索');search.append(inp,send);app.append(search);section('快捷标签','支持组合筛选');const chip=node('div','chips');T.forEach(([n,k])=>chip.append(btn(n,()=>{tags=tags.includes(k)?tags.filter(x=>x!==k):[...tags.filter(x=>!(k==='other:full_color$'&&x==='-other:full_color$')&&!(k==='-other:full_color$'&&x==='other:full_color$')),k];render()},'chip'+(tags.includes(k)?' on':''))));app.append(chip);section('探索分类','一键搜索');const tiles=node('div','tiles');C.forEach(([n,flag,sym])=>{const b=node('button','tile');b.append(node('span','',sym),node('b','',n));b.onclick=()=>open(urlFor(flag));tiles.append(b)});app.append(tiles);app.append(node('p','note','分类、标签搜索会在 Safari 中打开原站，由既有 EH 轻阅读 Userscripts 显示实际作品与正文。网页版不读取登录 Cookie，也不会绕过网站权限。'));section('我的书架',read('shelf').length+' 部');if(read('shelf').length)cards(read('shelf').slice(0,4),'shelf');else empty('收藏从第一本开始','打开书架添加漫画链接，或导入之前的收藏备份。','打开书架',()=>go('shelf'))}function collection(n){app.append(node('h1','',n==='shelf'?'我的书架':'阅读历史'));app.append(node('p','note','记录保存在当前设备浏览器内；清除浏览器网站数据可能导致丢失。'));const rows=read(n).filter(x=>valid(x.url));section(n==='shelf'?'已收藏':'最近读过',rows.length+' 部');if(rows.length)cards(rows,n);else empty('这里还没有记录',n==='shelf'?'手动添加链接，或者从原 Userscripts 导出的 JSON 中导入。':'从书架点击作品后会记录在这里。',n==='shelf'?'添加作品':'去书架',()=>n==='shelf'?add():go('shelf'));if(n==='shelf')app.append(btn('＋ 添加漫画',add,'primary'))}function exportData(){const data={schema:'ehr-lightreader-export-v1',source:'eh-web',shelf:read('shelf'),history:read('history')};const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=node('a');a.href=u;a.download='EH-LightReader-Web-Backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}function settings(){app.append(node('h1','','我的阅读空间'));const site=node('div','line');site.append(node('b','','默认漫画站点'),node('p','','搜索和阅读都会打开已授权的原站。'));const sel=node('select');[['https://e-hentai.org','E-Hentai'],['https://exhentai.org','ExHentai']].forEach(([u,n])=>{const o=node('option','',n);o.value=u;sel.append(o)});sel.value=host;sel.onchange=()=>{host=sel.value;localStorage.setItem('ehweb:host',host)};site.append(sel);app.append(site);const data=node('div','line');data.append(node('b','','数据备份与迁移'),node('p','','Userscripts 与网页版是不同网站，收藏和历史不会自动同步。可先在 Userscripts「设置」导出 JSON，再在这里导入。'));const row=node('div','actions'),file=node('input');file.type='file';file.accept='.json,application/json';file.style.display='none';file.onchange=async()=>{const f=file.files?.[0];if(!f||f.size>2e6)return alert('JSON 文件过大');try{const d=JSON.parse(await f.text());for(const n of ['shelf','history']){if(Array.isArray(d[n])){const a=d[n].filter(x=>x&&valid(x.url)).map(x=>({url:valid(x.url),title:String(x.title||'未命名作品').slice(0,200),cover:typeof x.cover==='string'&&x.cover.startsWith('https://')?x.cover:'',category:String(x.category||'').slice(0,32)}));save(n,[...a,...read(n).filter(x=>!a.some(y=>y.url===x.url))])}}alert('导入完成');go('shelf')}catch{alert('无法读取此备份文件')}};row.append(btn('导出 JSON',exportData),btn('导入 JSON',()=>file.click()),file);data.append(row);app.append(data);app.append(node('div','note','Web App 用于中文搜索入口和个人管理；独立域名不能直接读取原站的登录网页和图片。漫画翻页仍交给 Safari Userscripts。版本：Web 0.1 · 无需注册 · 无付费服务。'))}function render(){app.replaceChildren();if(tab==='discover')discover();else if(tab==='settings')settings();else collection(tab)}function go(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('sel',b.dataset.tab===t));render();scrollTo(0,0)}$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)};$('#theme').onclick=()=>{const v=document.documentElement.classList.toggle('light');localStorage.setItem('ehweb:theme',v?'light':'dark');$('#theme').textContent=v?'☼':'☾'};if(localStorage.getItem('ehweb:theme')==='light')document.documentElement.classList.add('light');render()})();
</script></body></html>
