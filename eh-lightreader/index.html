<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101016"><title>EH 轻阅读 · LightReader</title><style>body{margin:0;background:#101016;color:#e7e4ef;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.starting{padding:30px}a{color:#d0bcff}</style></head><body><div id="loading" class="starting">EH 轻阅读 · 正在启动…</div><script>(async()=>{try{if(!('DecompressionStream' in window))throw Error('当前 Safari 不支持压缩内容解码');const paths=['part-0.b64','part-1.b64','part-2.b64','part-3.b64'];const pieces=await Promise.all(paths.map(async file=>{const resp=await fetch('./assets/'+file);if(!resp.ok)throw Error('无法读取 '+file);return (await resp.text()).trim()}));const b=pieces.join('');const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));let page=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();page=page.replace('href="./icon-180.png"','href="./icon.svg"');document.open();document.write(page);document.close()}catch(err){document.querySelector('#loading').textContent='EH 轻阅读启动失败：'+err.message+'。请联网后重试。';}})();</script></body></html>
