<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101016"><title>EH 轻阅读 · LightReader</title><style>body{margin:0;background:#101016;color:#e7e4ef;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.starting{padding:30px}a{color:#d0bcff}</style></head><body><div id="loading" class="starting">EH 轻阅读 · 正在启动…</div><script>(async()=>{try{if(!('DecompressionStream' in window))throw Error('当前 Safari 不支持压缩内容解码');const paths=['part-0.b64','part-1.b64','part-2.b64','part-3.b64'];const pieces=await Promise.all(paths.map(async file=>{const resp=await fetch('./assets/'+file);if(!resp.ok)throw Error('无法读取 '+file);return (await resp.text()).trim()}));const b=pieces.join('');const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));let page=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();page=page.replace('href="./icon-180.png"','href="./icon.svg"');page=page.replace('</head>','<style>.icon-btn{width:48px!important;height:48px!important;min-width:48px!important;touch-action:manipulation}.chip{min-height:44px!important;touch-action:manipulation}.primary{min-height:44px!important}</style></head>');page=page.replace('</body>',"<script>(()=>{const KEY='ehrweb:v1:externalNotice';let enabled=false;try{enabled=localStorage.getItem(KEY)==='1';}catch{}if(enabled)return;const box=document.createElement('dialog');box.id='ehr-cross-origin-help';box.style.cssText='max-width:420px;width:90vw;border-radius:22px;background:#211d2c;color:#f7f1ff;border:1px solid #474056;padding:24px;line-height:1.65;box-shadow:0 20px 55px #0009';box.innerHTML='<h2 style=\"margin-top:0;font-size:21px\">打开漫画网站前</h2><p>网页版无法直接替换 E-Hentai 的网页。<b>请先在 Safari 的 Userscripts 中开启「EH 轻阅读」，并允许该网站使用扩展。</b></p><p style=\"font-size:13px;color:#bab2c9\">若脚本关闭，继续后会显示原站界面。</p><div style=\"display:flex;gap:10px;justify-content:flex-end\"><button type=\"button\" id=\"ehr-cross-cancel\" style=\"padding:12px\">暂不打开</button><button type=\"button\" id=\"ehr-cross-continue\" style=\"padding:12px;background:#865de1;color:white;border:0;border-radius:10px\">已开启，继续</button></div>';document.body.append(box);box.querySelector('#ehr-cross-cancel').onclick=()=>box.close();document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a||a.target!=='_blank')return;let u;try{u=new URL(a.href);}catch{return;}if(u.protocol!=='https:'||!['e-hentai.org','exhentai.org'].includes(u.hostname))return;try{if(localStorage.getItem(KEY)==='1')return;}catch{}e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();box.querySelector('#ehr-cross-continue').onclick=()=>{try{localStorage.setItem(KEY,'1')}catch{}box.close();const link=document.createElement('a');link.href=u.href;link.target='_blank';link.rel='noopener noreferrer';document.body.append(link);link.click();link.remove()};box.showModal();},true)})();<\/script></body>");document.open();document.write(page);document.close()}catch(err){document.querySelector('#loading').textContent='EH 轻阅读启动失败：'+err.message+'。请联网后重试。';}})();</script></body></html>
