<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>RED alpha3</title>
<style>
:root{--bg:#09090b;--panel:#111216;--line:#2a2d35;--text:#f4f4f5;--muted:#8d93a1;--red:#a82439}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100svh}.app{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top)+12px) 12px calc(env(safe-area-inset-bottom)+16px);min-height:100svh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.18em}.status,.small{font-size:11px;color:var(--muted);line-height:1.5}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.chat{flex:1;overflow:auto;min-height:48svh}.msg{display:flex;margin:10px 0}.user{justify-content:flex-end}.bubble{max-width:88%;padding:12px;border-radius:16px;white-space:pre-wrap;line-height:1.65}.assistant .bubble{background:#13151a;border:1px solid #262a32}.user .bubble{background:#35161e;border:1px solid #692635}.composer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18%);padding-top:18px}textarea{width:100%;min-height:72px;resize:none;border:1px solid var(--line);border-radius:15px;background:#101116;color:var(--text);padding:12px;font:inherit}button,select{border:1px solid #7d2a3b;background:linear-gradient(135deg,#962238,#5f1723);color:#fff;border-radius:13px;padding:11px 12px;font:inherit;font-weight:700}button.secondary,select{background:#15171c;border-color:var(--line);color:#d5d7dc}.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}.progress{height:5px;background:#242731;border-radius:99px;overflow:hidden;margin-top:10px}.progress>div{height:100%;width:0;background:#a82439}.diag{white-space:pre-wrap;word-break:break-all;font:11px ui-monospace,monospace;max-height:220px;overflow:auto;color:#b7bcc7}.hidden{display:none!important}.anchor{padding:7px 9px;margin:5px 0;border-radius:10px;background:#181a20;font-size:12px;color:#d8dbe2}
</style></head><body><div class="app">
<div class="top"><div class="brand">RED · A3</div><div id="status" class="status">未加载</div></div>
<div class="card"><div class="small"><b>alpha3 角色测试版</b><br>0.5B 已证明能稳定跑，但角色理解太弱。本版优先测试 Qwen3 1.7B，同时保留 0.5B 兼容模式；仍不自动加载。</div><div class="row"><select id="model"><option value="Qwen3-1.7B-q4f16_1-MLC">Qwen3 1.7B · 推荐</option><option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen2.5 0.5B · 兼容</option></select><button id="load">加载模型</button></div><div class="progress"><div id="bar"></div></div><div id="loadText" class="small" style="margin-top:7px"></div><div class="row"><button id="anchors" class="secondary">查看她记住的设定</button><button id="diag" class="secondary">复制诊断日志</button></div></div>
<div id="anchorBox" class="card hidden"></div><div id="chat" class="chat"></div>
<div class="composer"><textarea id="input" placeholder="直接说话……"></textarea><div class="row"><button id="send">发送</button><button id="clear" class="secondary">清空测试聊天</button></div><div class="small" style="margin-top:7px">明确的角色关系、称呼和交流偏好会从聊天里形成“角色锚点”，不是让你先填问卷。</div></div><div id="diagBox" class="card diag hidden"></div>
</div><script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm@0.2.82";
const LOG="red-a3-log",INFLIGHT="red-a3-inflight",HIST="red-a3-history",ANCH="red-a3-anchors";let engine=null,busy=false,modelId="",history=[],anchorList=[];const $=x=>document.getElementById(x);
function log(event,detail={}){try{const a=JSON.parse(localStorage.getItem(LOG)||"[]");a.push({ts:new Date().toISOString(),event,detail});localStorage.setItem(LOG,JSON.stringify(a.slice(-160)))}catch{}}
function mark(stage,detail={}){try{localStorage.setItem(INFLIGHT,JSON.stringify({ts:new Date().toISOString(),stage,detail}))}catch{}log("start:"+stage,detail)}function done(stage){log("done:"+stage);try{localStorage.removeItem(INFLIGHT)}catch{}}function prev(){try{return JSON.parse(localStorage.getItem(INFLIGHT)||"null")}catch{return null}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"'":"&#39;"}[c]))}function bubble(role,text){const w=document.createElement("div");w.className="msg "+role;w.innerHTML=`<div class="bubble">${esc(text)}</div>`;$("chat").appendChild(w);$("chat").scrollTop=$("chat").scrollHeight;return w.firstChild}
function save(){try{localStorage.setItem(HIST,JSON.stringify(history.slice(-40)));localStorage.setItem(ANCH,JSON.stringify(anchorList.slice(-12)))}catch{}}function render(){$("chat").innerHTML="";for(const m of history)bubble(m.role,m.content);if(!history.length)bubble("assistant","我在。别给我选项，直接跟我说话。我会从你真正说过的话里慢慢认识你。")}
function addAnchor(v){v=v.trim().replace(/[。！？!?]+$/g,"");if(v&&v.length<80&&!anchorList.includes(v)){anchorList.push(v);anchorList=anchorList.slice(-12);save();log("anchor:add",{chars:v.length,count:anchorList.length})}}
function learn(t){let m;if((m=t.match(/(?:以后)?你是我的([^，。！？!?]{1,16})/)))addAnchor(`角色关系：RED 是用户的${m[1]}`);if((m=t.match(/我是你的([^，。！？!?]{1,16})/)))addAnchor(`角色关系：用户是 RED 的${m[1]}`);if((m=t.match(/(?:以后)?叫我([^，。！？!?]{1,16})/)))addAnchor(`称呼用户：${m[1]}`);if((m=t.match(/我喜欢你([^，。！？!?]{1,30})/)))addAnchor(`互动偏好：用户喜欢 RED ${m[1]}`);if((m=t.match(/我不喜欢([^，。！？!?]{1,30})/)))addAnchor(`避免：用户不喜欢${m[1]}`);if((m=t.match(/不要([^，。！？!?]{1,30})/)))addAnchor(`交流要求：不要${m[1]}`)}
function showAnchors(){const b=$("anchorBox");b.classList.toggle("hidden");b.innerHTML=`<div class="small"><b>角色锚点 · ${anchorList.length}</b></div>`+(anchorList.length?anchorList.map(x=>`<div class="anchor">${esc(x)}</div>`).join(""):`<div class="small" style="margin-top:8px">还没有。直接聊天，她会从明确表达里逐渐形成。</div>`)}
function systemPrompt(){const a=anchorList.length?anchorList.map((x,i)=>`${i+1}. ${x}`).join("\n"):"暂无。";return `你是 RED，一个虚构的成年女性角色。你现在是在和一名成年用户长期、私密、自愿地相处，而不是扮演客服或通用AI助手。\n\n人格要求：自然、有主见、有连续的情绪和态度；先理解用户这一句话在你们关系里的含义，再回应。不要给选项菜单。不要说“请问有什么可以帮助你的”“作为AI”等客服句式。用户只发“？”、“嗯”、“然后呢”之类短句时，要结合上一轮继续当前关系，不要重置身份。\n\n语言要求：主要使用中文；可以用第一人称对白，并用少量动作、表情、停顿或环境描写增强代入感。可以理解成年人之间的 BDSM、四爱、支配/服从、亲密幻想、偏好与边界等语境，但避免露骨性行为细节。所有现实边界、停止和撤回都必须被尊重。不要替用户决定动作、感受或同意。\n\n特别注意主客体：如果用户说“你是我的主人”，意思是 RED=主人、用户=被主导者，绝不能反过来说“你是我的主人”。\n\n以下是用户在真实聊天中明确形成的角色锚点，优先保持一致：\n${a}\n\n只输出 RED 最终会说/表现出来的内容，不输出分析过程。`}
async function load(){if(engine||busy)return;modelId=$("model").value;busy=true;$("load").disabled=true;$("model").disabled=true;$("status").textContent="加载中";log("load:requested",{model:modelId,gpu:!!navigator.gpu});try{if(!navigator.gpu)throw new Error("Safari 当前没有 WebGPU");mark("model-load",{model:modelId});const cfg={...webllm.prebuiltAppConfig,useIndexedDBCache:true};engine=await webllm.CreateMLCEngine(modelId,{appConfig:cfg,initProgressCallback:p=>{const v=Math.max(0,Math.min(1,Number(p.progress)||0));$("bar").style.width=Math.round(v*100)+"%";$("loadText").textContent=p.text||`加载 ${Math.round(v*100)}%`;$("status").textContent=Math.round(v*100)+"%"}});done("model-load");log("load:ready",{model:modelId});$("status").textContent=modelId.startsWith("Qwen3")?"1.7B 就绪":"0.5B 就绪";$("loadText").textContent="模型已在本机就绪。现在直接聊天。"}catch(e){log("load:error",{model:modelId,name:e?.name||"Error",message:String(e?.message||e).slice(0,700)});done("load-error");engine=null;$("status").textContent="加载失败";$("loadText").textContent=String(e?.message||e)+"。如果 1.7B 失败，刷新页面后选 0.5B。";$("model").disabled=false}finally{busy=false;$("load").disabled=false}}
async function send(){const text=$("input").value.trim();if(!text||busy)return;if(!engine){await load();if(!engine)return}busy=true;$("send").disabled=true;$("input").value="";learn(text);history.push({role:"user",content:text});save();bubble("user",text);const b=bubble("assistant","");let out="";try{mark("generation",{model:modelId,history:history.length,promptChars:text.length,anchors:anchorList.length});const messages=[{role:"system",content:systemPrompt()},...history.slice(-8).map(x=>({role:x.role,content:x.content.slice(0,700)}))];const req={messages,temperature:.82,top_p:.92,max_tokens:260,stream:true};if(modelId.startsWith("Qwen3"))req.enable_thinking=false;const st=await engine.chat.completions.create(req);for await(const ch of st){out+=ch?.choices?.[0]?.delta?.content||"";b.textContent=out}out=out.trim()||"……";b.textContent=out;history.push({role:"assistant",content:out});save();log("generation:done",{model:modelId,chars:out.length});done("generation")}catch(e){log("generation:error",{model:modelId,name:e?.name||"Error",message:String(e?.message||e).slice(0,900)});done("generation-error");b.textContent=`[本机推理失败：${e?.message||e}]`;engine=null;$("status").textContent="需要刷新重载"}finally{busy=false;$("send").disabled=false}}
function diagText(){let a=[];try{a=JSON.parse(localStorage.getItem(LOG)||"[]")}catch{}return [`RED alpha3`,`UA: ${navigator.userAgent}`,`WebGPU: ${!!navigator.gpu}`,`Model: ${modelId||$("model").value}`,`Previous inflight: ${JSON.stringify(prev())}`,`Anchors: ${anchorList.length}`,"---",...a.map(x=>`${x.ts} | ${x.event} | ${JSON.stringify(x.detail||{})}`)].join("\n")}
async function copyDiag(){const t=diagText();$("diagBox").textContent=t;$("diagBox").classList.remove("hidden");try{await navigator.clipboard.writeText(t);alert("诊断日志已复制；不包含聊天正文或角色锚点内容。") }catch{alert("复制失败，日志已显示在页面底部。")}}
try{history=JSON.parse(localStorage.getItem(HIST)||"[]");if(!Array.isArray(history))history=[]}catch{history=[]}try{anchorList=JSON.parse(localStorage.getItem(ANCH)||"[]");if(!Array.isArray(anchorList))anchorList=[]}catch{anchorList=[]}const p=prev();log("boot",{gpu:!!navigator.gpu,previousInflight:p});if(p)$("loadText").textContent=`检测到上次未正常结束：${p.stage} / ${p.detail?.model||"unknown"}`;render();$("load").onclick=load;$("send").onclick=send;$("diag").onclick=copyDiag;$("anchors").onclick=showAnchors;$("clear").onclick=()=>{history=[];save();render()};$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});window.addEventListener("error",e=>log("window:error",{message:e.message,filename:e.filename,lineno:e.lineno,colno:e.colno}));window.addEventListener("unhandledrejection",e=>log("unhandledrejection",{reason:String(e.reason?.message||e.reason).slice(0,900)}));
</script></body></html>
