<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>RED SAFE</title>
<style>
:root{--bg:#09090b;--panel:#111216;--line:#2a2d35;--text:#f4f4f5;--muted:#8d93a1;--red:#a82439;--green:#69c68b;--yellow:#d7aa58}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100svh}.app{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top)+12px) 12px calc(env(safe-area-inset-bottom)+16px);min-height:100svh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.18em}.status{font-size:11px;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.notice{font-size:12px;line-height:1.6;color:#c4c7cf}.chat{flex:1;overflow:auto;min-height:50svh}.msg{display:flex;margin:10px 0}.user{justify-content:flex-end}.bubble{max-width:88%;padding:12px;border-radius:16px;white-space:pre-wrap;line-height:1.65}.assistant .bubble{background:#13151a;border:1px solid #262a32}.user .bubble{background:#35161e;border:1px solid #692635}.composer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18%);padding-top:18px}textarea{width:100%;min-height:72px;resize:none;border:1px solid var(--line);border-radius:15px;background:#101116;color:var(--text);padding:12px;font:inherit}button{border:1px solid #7d2a3b;background:linear-gradient(135deg,#962238,#5f1723);color:#fff;border-radius:13px;padding:11px 14px;font:inherit;font-weight:700}button.secondary{background:#15171c;border-color:var(--line);color:#d5d7dc}.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}.progress{height:5px;background:#242731;border-radius:99px;overflow:hidden;margin-top:10px}.progress>div{height:100%;width:0;background:#a82439}.small{font-size:10px;color:var(--muted);line-height:1.5}.hidden{display:none!important}.diag{white-space:pre-wrap;word-break:break-all;font:11px ui-monospace,monospace;max-height:220px;overflow:auto;color:#b7bcc7}
</style></head><body><div class="app">
<div class="top"><div class="brand">RED · SAFE</div><div id="status" class="status">未加载</div></div>
<div id="setup" class="card"><div class="notice"><b>alpha2 崩溃定位版</b><br>不自动加载模型；默认只用 0.5B；不会上传聊天正文。先确认这台 iPhone 能稳定完成“加载 → 发送 → 回复”。</div><div class="progress"><div id="bar"></div></div><div id="loadText" class="small" style="margin-top:7px"></div><div class="row"><button id="loadBtn">加载本地模型</button><button id="diagBtn" class="secondary">复制诊断日志</button></div></div>
<div id="chat" class="chat"></div>
<div class="composer"><textarea id="input" placeholder="直接说话……"></textarea><div class="row"><button id="sendBtn">发送</button><button id="clearBtn" class="secondary">清空测试聊天</button></div><div class="small" style="margin-top:7px">本版不做后台自动加载，避免 Safari 崩溃后反复重进死循环。</div></div>
<div id="diagBox" class="card diag hidden"></div>
</div>
<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm@0.2.82";
const MODEL="Qwen2.5-0.5B-Instruct-q4f16_1-MLC", LOG="red-safe-a2-log", INFLIGHT="red-safe-a2-inflight", HIST="red-safe-a2-history";
let engine=null,busy=false,history=[];const $=id=>document.getElementById(id);
function log(event,detail={}){try{const a=JSON.parse(localStorage.getItem(LOG)||"[]");a.push({ts:new Date().toISOString(),event,detail});localStorage.setItem(LOG,JSON.stringify(a.slice(-120)))}catch{}}
function mark(stage,detail={}){try{localStorage.setItem(INFLIGHT,JSON.stringify({ts:new Date().toISOString(),stage,detail}))}catch{};log("start:"+stage,detail)}
function done(stage){log("done:"+stage);try{localStorage.removeItem(INFLIGHT)}catch{}}
function prev(){try{return JSON.parse(localStorage.getItem(INFLIGHT)||"null")}catch{return null}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"'":"&#39;"}[c]))}
function bubble(role,text){const w=document.createElement("div");w.className="msg "+role;w.innerHTML=`<div class="bubble">${esc(text)}</div>`;$("chat").appendChild(w);$("chat").scrollTop=$("chat").scrollHeight;return w.querySelector(".bubble")}
function save(){try{localStorage.setItem(HIST,JSON.stringify(history.slice(-30)))}catch{}}
function render(){$("chat").innerHTML="";for(const m of history)bubble(m.role,m.content);if(!history.length)bubble("assistant","我在。这个版本先只验证一件事：我能不能在这台手机里稳定地跟你说话。")}
function diagText(){let a=[];try{a=JSON.parse(localStorage.getItem(LOG)||"[]")}catch{};return [`RED SAFE alpha2`,`UA: ${navigator.userAgent}`,`WebGPU: ${!!navigator.gpu}`,`Model: ${MODEL}`,`Previous inflight: ${JSON.stringify(prev())}`,"---",...a.map(x=>`${x.ts} | ${x.event} | ${JSON.stringify(x.detail||{})}`)].join("\n")}
async function copyDiag(){const t=diagText();$("diagBox").textContent=t;$("diagBox").classList.remove("hidden");try{await navigator.clipboard.writeText(t);alert("诊断日志已复制，直接粘贴给二蛋。日志不包含聊天正文。") }catch{alert("复制失败，日志已经显示在页面底部，可以截图。")}}
async function load(){if(engine||busy)return;busy=true;$("loadBtn").disabled=true;$("status").textContent="加载中";log("load:requested",{gpu:!!navigator.gpu});try{if(!navigator.gpu)throw new Error("Safari 当前没有 WebGPU");mark("model-load",{model:MODEL});engine=await webllm.CreateMLCEngine(MODEL,{appConfig:{...webllm.prebuiltAppConfig,cacheBackend:"indexeddb"},initProgressCallback:p=>{const v=Math.max(0,Math.min(1,Number(p.progress)||0));$("bar").style.width=Math.round(v*100)+"%";$("loadText").textContent=p.text||`加载 ${Math.round(v*100)}%`;$("status").textContent=Math.round(v*100)+"%";log("load:progress",{pct:Math.round(v*100)})}});done("model-load");log("load:ready");$("status").textContent="本机就绪";$("loadText").textContent="0.5B 已就绪。现在发送一句普通话测试。"}catch(e){log("load:error",{name:e?.name||"Error",message:String(e?.message||e).slice(0,500)});done("load-error");$("status").textContent="加载失败";$("loadText").textContent=String(e?.message||e);engine=null}finally{busy=false;$("loadBtn").disabled=false}}
function sys(){return `你是 RED，一个虚构成年女性角色，与成年用户进行长期、私密、自愿的角色互动。像真实的人一样自然回应，不给选项菜单，不像客服。可以理解 BDSM、四爱、支配与服从、成人幻想、偏好和边界等成人语境，并保持角色连续性；可以有心理张力、欲望、动作、表情和环境描写，但避免露骨性行为细节。不要替用户决定动作、感受或同意。拒绝和停止必须被尊重。只输出角色最终回应，不展示分析过程。`}
async function send(){const text=$("input").value.trim();if(!text||busy)return;if(!engine){await load();if(!engine)return}busy=true;$("sendBtn").disabled=true;$("input").value="";history.push({role:"user",content:text});save();bubble("user",text);const b=bubble("assistant","");let out="";try{mark("generation",{model:MODEL,history:history.length,promptChars:text.length});const messages=[{role:"system",content:sys()},...history.slice(-6).map(x=>({role:x.role,content:x.content.slice(0,900)}))];const st=await engine.chat.completions.create({messages,temperature:.78,top_p:.9,max_tokens:220,stream:true});for await(const ch of st){out+=ch?.choices?.[0]?.delta?.content||"";b.textContent=out}out=out.trim()||"……";b.textContent=out;history.push({role:"assistant",content:out});save();log("generation:done",{chars:out.length});done("generation")}catch(e){log("generation:error",{name:e?.name||"Error",message:String(e?.message||e).slice(0,800)});done("generation-error");b.textContent=`[本机推理失败：${e?.message||e}]`;engine=null;$("status").textContent="需要重载"}finally{busy=false;$("sendBtn").disabled=false}}
try{history=JSON.parse(localStorage.getItem(HIST)||"[]");if(!Array.isArray(history))history=[]}catch{history=[]}
const p=prev();log("boot",{gpu:!!navigator.gpu,previousInflight:p});if(p){$("loadText").textContent=`检测到上次未正常结束：${p.stage}。这通常意味着 Safari/WebGPU 进程被系统杀掉。`}
render();$("loadBtn").onclick=load;$("diagBtn").onclick=copyDiag;$("sendBtn").onclick=send;$("clearBtn").onclick=()=>{history=[];save();render()};$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
window.addEventListener("error",e=>log("window:error",{message:e.message,filename:e.filename,lineno:e.lineno,colno:e.colno}));window.addEventListener("unhandledrejection",e=>log("unhandledrejection",{reason:String(e.reason?.message||e.reason).slice(0,800)}));
</script></body></html>
