name: Inspect pose preview
on:
  push:
    paths:
      - ".github/workflows/inspect-hq02.yml"
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Decode pose preview
        run: |
          python - <<'PY'
          from PIL import Image
          p="red-mobile-a8/assets/r-body-v1/pose-preview.webp"
          im=Image.open(p); im.load()
          print("pose-preview",im.size,im.mode)
          im.convert("RGBA").save("pose-preview.png")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pose-preview-inspect
          path: |
            red-mobile-a8/assets/r-body-v1/pose-preview.webp
            pose-preview.png
