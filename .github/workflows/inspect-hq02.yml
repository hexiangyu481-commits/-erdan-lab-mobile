name: Inspect R Assets
on:
  push:
    paths:
      - ".github/workflows/inspect-hq02.yml"
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pillow-avif-plugin
      - name: Assemble pose atlas
        run: |
          python - <<'PY'
          import base64,re,pathlib,io
          from PIL import Image
          import pillow_avif
          parts=[]
          for i in range(8):
              p=pathlib.Path(f"red-mobile-a8/assets/r-body-v2/atlas/chunk-0{i}.js")
              s=p.read_text(encoding="utf-8")
              m=re.search(r"='([^']*)'",s)
              if not m: raise RuntimeError(f"missing atlas chunk {i}")
              parts.append(m.group(1))
          b64="".join(parts)
          print("atlas_lengths",[len(x) for x in parts],"sum",len(b64))
          raw=base64.b64decode(b64,validate=True)
          pathlib.Path("r-pose-atlas.avif").write_bytes(raw)
          im=Image.open(io.BytesIO(raw))
          print("atlas",im.size,im.mode,"frames",getattr(im,"n_frames",1),"bytes",len(raw))
          im.convert("RGBA").save("r-pose-atlas.png")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r-pose-atlas-inspect
          path: |
            r-pose-atlas.avif
            r-pose-atlas.png
