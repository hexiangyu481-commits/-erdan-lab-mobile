name: Verify Live02
on:
  push:
    paths:
      - ".github/workflows/inspect-hq02.yml"
      - "red-mobile-a8/assets/r-body-v2/live02/**"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Assemble and verify animated WebP
        run: |
          python - <<'PY'
          import base64,re,pathlib,io,hashlib
          from PIL import Image
          parts=[]
          for i in range(4):
              p=pathlib.Path(f"red-mobile-a8/assets/r-body-v2/live02/chunk-{i}.js")
              s=p.read_text(encoding="utf-8")
              m=re.search(r"='([^']*)'",s)
              if not m: raise RuntimeError(f"missing live02 chunk {i}")
              parts.append(m.group(1))
          b64="".join(parts)
          raw=base64.b64decode(b64,validate=True)
          pathlib.Path("live02.webp").write_bytes(raw)
          im=Image.open(io.BytesIO(raw))
          frames=getattr(im,"n_frames",1)
          durations=[]
          for i in range(frames):
              im.seek(i)
              durations.append(im.info.get("duration"))
          print("LIVE02_OK","size",im.size,"mode",im.mode,"frames",frames,"durations",durations,"bytes",len(raw),"sha256",hashlib.sha256(raw).hexdigest())
          if frames < 5:
              raise SystemExit("live02 needs at least 5 frames")
          im.seek(0); im.convert("RGBA").save("live02-frame0.png")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live02-verify
          path: |
            live02.webp
            live02-frame0.png
