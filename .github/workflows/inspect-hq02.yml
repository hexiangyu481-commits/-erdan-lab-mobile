name: Inspect HQ02
on:
  push:
    paths:
      - ".github/workflows/inspect-hq02.yml"
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Recover missing base64 symbol and verify HQ02
        run: |
          python - <<'PY'
          from PIL import Image
          import base64,re,pathlib,io,string
          parts=[]
          for i in range(6):
              s=pathlib.Path(f"red-mobile-a8/assets/r-body-v1/hq02/chunk-{i}.js").read_text(encoding="utf-8")
              m=re.search(r"='([^']*)'",s)
              if not m: raise RuntimeError(f"missing chunk {i}")
              parts.append(m.group(1))
          print("lengths", [len(x) for x in parts], "sum", sum(map(len,parts)))
          alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
          prefix="".join(parts[:3])
          suffix="".join(parts[3:])
          ok=[]
          for ch in alphabet:
              b64=prefix+ch+suffix
              try:
                  raw=base64.b64decode(b64,validate=True)
                  im=Image.open(io.BytesIO(raw))
                  im.load()
                  ok.append((ch,im.size,im.mode,len(raw)))
              except Exception:
                  pass
          print("VALID_CANDIDATES",ok)
          if len(ok)!=1:
              raise SystemExit(f"expected 1 valid candidate, got {len(ok)}")
          ch,size,mode,n=ok[0]
          raw=base64.b64decode(prefix+ch+suffix,validate=True)
          pathlib.Path("hq02-recovered.webp").write_bytes(raw)
          Image.open(io.BytesIO(raw)).convert("RGBA").save("hq02-recovered.png")
          print("RECOVERED_CHAR",ch,"SIZE",size,"MODE",mode,"BYTES",n)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hq02-recovered
          path: |
            hq02-recovered.webp
            hq02-recovered.png
