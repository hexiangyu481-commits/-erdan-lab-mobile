name: Inspect HQ02
on:
  push:
    paths:
      - ".github/workflows/inspect-hq02.yml"
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Render inspection images
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          import base64,re,pathlib
          parts=[]
          for i in range(6):
              p=pathlib.Path(f"red-mobile-a8/assets/r-body-v1/hq02/chunk-{i}.js")
              s=p.read_text(encoding="utf-8")
              m=re.search(r"='([^']*)'",s)
              if not m:
                  raise RuntimeError(f"missing chunk {i}")
              parts.append(m.group(1))
          raw=base64.b64decode("".join(parts))
          pathlib.Path("hq02.webp").write_bytes(raw)
          im=Image.open("hq02.webp").convert("RGBA")
          print("size", im.size, "bytes", len(raw))
          im.save("hq02.png")
          g=Image.new("RGB",im.size,(24,24,24))
          g.paste(im.convert("RGB"),mask=im.getchannel("A"))
          d=ImageDraw.Draw(g)
          w,h=g.size
          for x in range(0,w,25):
              d.line((x,0,x,h),fill=(255,0,0),width=1)
              d.text((x+1,1),str(x),fill=(255,255,0))
          for y in range(0,h,25):
              d.line((0,y,w,y),fill=(0,255,255),width=1)
              d.text((1,y+1),str(y),fill=(255,255,0))
          g.save("hq02-grid.png")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hq02-inspect
          path: |
            hq02.webp
            hq02.png
            hq02-grid.png
