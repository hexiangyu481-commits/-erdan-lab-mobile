<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#130f1d"><title>EH 轻阅读 Cloud Beta</title>
<style>:root{color-scheme:dark;font-family:-apple-system,"PingFang SC",sans-serif;color:#eee8fa;background:#100d17}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{position:sticky;top:0;background:#1d1629ef;backdrop-filter:blur(15px);border-bottom:1px solid #544169;padding:15px 18px;z-index:2}h1{margin:0;font-size:20px}small,p{color:#bbaecc}main{max-width:850px;margin:auto;padding:18px 14px 90px}.notice,.panel{background:#211a2e;border:1px solid #534263;border-radius:18px;padding:14px;margin:14px 0;line-height:1.6}.notice{font-size:13px}button,input,select{font:inherit;min-height:48px;border-radius:13px;border:1px solid #55436f;color:white}button{padding:9px 16px;background:#7950bc;font-weight:650}button.secondary{background:#32283f}button:disabled{opacity:.4}input,select{background:#2b2139;padding:10px;min-width:0}label{display:block;margin:9px 0 5px;font-size:13px}.panel input{width:100%}.row{display:flex;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}.row input{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#281f35;border-radius:15px;border:1px solid #493759;overflow:hidden}.card img{width:100%;height:165px;object-fit:cover;background:#342741}.card strong,.card small{display:block;padding:6px 10px}.card strong{font-size:13px;line-height:1.4}.card small{font-size:11px}#status{padding:12px;color:#d4b6ff}.hide{display:none!important}#reader{text-align:center}#readingImage{max-width:100%;max-height:75vh;object-fit:contain;border-radius:4px}nav{position:sticky;bottom:0;display:flex;background:#201729ee;padding:10px;gap:10px}nav button{flex:1}.badge{font-size:12px;color:#dfc6ff;border:1px solid #7550a8;border-radius:30px;padding:5px 10px;display:inline-block}</style>
</head><body><header><h1>EH 轻阅读 <small>云端测试版</small></h1></header><main><span class="badge">v1.4.0 beta · 不影响已安装的 v1.3.2</span><p class="notice">这是不依赖 Userscripts 的独立网页试验。请先用已有 Cloudflare 账号创建“EH LightReader API”独立 Worker。搜索与图片仍受原站访问规则限制；遇到权限拒绝会明确提示，不会绕过。</p>
<section class="panel" id="connectPanel"><h2>连接独立 Worker</h2><label for="endpoint">Worker 地址</label><input id="endpoint" placeholder="https://eh-lightreader-api.xxx.workers.dev" spellcheck="false" autocapitalize="off"><label for="secret">独立连接码（只保留在本次会话）</label><input id="secret" type="password" autocomplete="off"><div class="row"><button id="connect">测试连接</button><button class="secondary" id="forget">清除地址</button></div></section>
<section id="searchPanel" class="hide"><h2>发现</h2><div class="row"><input id="searchInput" type="search" placeholder="作品名称 / 标签"><select id="category"><option value="0">全部</option><option value="2">同人志</option><option value="4">漫画</option><option value="8">画师 CG</option><option value="16">游戏 CG</option><option value="32">图集</option><option value="64">Cosplay</option><option value="256">非成人</option><option value="512">欧美</option></select><button id="find">搜索</button></div><div class="row"><button id="previous" class="secondary">上一页</button><span id="searchPage">第 1 页</span><button id="next" class="secondary">下一页</button></div><div id="results" class="grid"></div></section>
<section id="gallery" class="hide"><button id="backSearch" class="secondary">← 返回搜索</button><h2 id="galleryName"></h2><p id="galleryMeta"></p><button id="beginRead">开始阅读</button></section>
<section id="reader" class="hide"><div class="row"><button id="backGallery" class="secondary">← 目录</button><span id="readingPage"></span></div><p id="pictureStatus"></p><img id="readingImage" alt="漫画图片"><nav><button id="prevImage">上一页</button><button id="nextImage">下一页</button></nav></section><p id="status" role="status">尚未连接云端服务。</p></main>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),state={base:'',secret:'',page:0,items:[],gallery:null,links:[],index:0,dir:0};
$('endpoint').value=localStorage.getItem('ehlr:worker_url')||'';
function message(s){$('status').textContent=s}
function show(section){for(const id of ['searchPanel','gallery','reader'])$(id).classList.toggle('hide',section!==id)}
function root(raw){try{const u=new URL(raw);if(u.protocol==='https:'&&!u.username&&!u.password&&!u.port&&!u.search&&!u.hash&&u.pathname.replace(/\//g,'')==='')return u.origin}catch{}return null}
async function call(path){if(!state.base||!state.secret)throw Error('尚未连接');let res;try{res=await fetch(state.base+path,{headers:{authorization:'Bearer '+state.secret},cache:'no-store'})}catch{throw Error('网络错误或 Worker 尚未部署 / CORS 未配置')}let data;try{data=await res.json()}catch{throw Error('返回的不是 JSON')}if(!res.ok)throw Error((data.error||'请求失败')+'（HTTP '+res.status+'）'+(data.retry_after?'，约 '+data.retry_after+' 秒后再试':''));return data}
$('connect').onclick=async()=>{state.base=root($('endpoint').value)||'';state.secret=$('secret').value.trim();if(!state.base||state.secret.length<20){message('请填写 HTTPS 根地址和至少 20 位连接码');return}try{await call('/api/status');localStorage.setItem('ehlr:worker_url',state.base);show('searchPanel');message('✅ 已连接。可以进行真实站点搜索测试。')}catch(e){message('⚠️ '+e.message)}};
$('forget').onclick=()=>{localStorage.removeItem('ehlr:worker_url');$('endpoint').value='';$('secret').value='';state.base='';state.secret='';show('');message('地址和连接码已清除')};
function tile(item){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.loading='lazy';img.referrerPolicy='no-referrer';if(item.thumb)img.src=item.thumb;img.onerror=()=>img.remove();const name=document.createElement('strong');name.textContent=item.title||'作品 #'+item.gid;const sub=document.createElement('small');sub.textContent=(item.category||'漫画')+' · '+(item.pages||'?')+' 页';card.append(img,name,sub);card.onclick=()=>openGallery(item);return card}
async function search(){message('正在搜索…');$('results').replaceChildren();const query=new URLSearchParams({q:$('searchInput').value.trim(),cat:$('category').value,page:state.page});try{const result=await call('/api/search?'+query);state.items=result.items||[];state.items.forEach(item=>$('results').append(tile(item)));$('searchPage').textContent='第 '+(state.page+1)+' 页';message(result.warning?'⚠️ 搜索返回 '+state.items.length+' 项，元数据暂不可用':'查询返回 '+state.items.length+' 项')}catch(e){message('⚠️ '+e.message)}}
$('find').onclick=()=>{state.page=0;search()};$('previous').onclick=()=>{if(state.page>0){state.page--;search()}};$('next').onclick=()=>{state.page++;search()};
async function openGallery(item){state.gallery=item;state.links=[];state.dir=0;show('gallery');$('galleryName').textContent=item.title||'作品';$('galleryMeta').textContent=(item.category||'')+' · '+(item.pages||'?')+' 页';$('beginRead').disabled=true;message('正在读取漫画目录…');try{const data=await call('/api/catalog?'+new URLSearchParams({gid:item.gid,token:item.token,p:0}));state.links=data.links||[];$('beginRead').disabled=!state.links.length;message('读取到 '+state.links.length+' 个页面链接');}catch(e){message('⚠️ '+e.message)}}
$('backSearch').onclick=()=>show('searchPanel');$('beginRead').onclick=()=>openImage(0);$('backGallery').onclick=()=>show('gallery');
async function openImage(index){if(index<0)return;if(index>=state.links.length){try{const p=state.dir+1;const data=await call('/api/catalog?'+new URLSearchParams({gid:state.gallery.gid,token:state.gallery.token,p}));state.dir=p;for(const l of data.links||[])if(!state.links.some(x=>x.page===l.page))state.links.push(l);if(index>=state.links.length){message('已到最后一页');return}}catch(e){message('⚠️ '+e.message);return}}
 state.index=index;show('reader');const entry=state.links[index];$('readingPage').textContent='第 '+entry.page+' 页';$('readingImage').removeAttribute('src');$('pictureStatus').textContent='正在获取图片地址…';message('');
 try{const data=await call('/api/image?'+new URLSearchParams({url:entry.url}));const img=$('readingImage');img.onload=()=>{$('pictureStatus').textContent='';message('图片已加载')};img.onerror=()=>{$('pictureStatus').textContent='图片加载失败：可能被原站限制或图片不可用';message('⚠️ 图片资源未能显示')};img.src=data.image_url;}catch(e){message('⚠️ '+e.message);$('pictureStatus').textContent='当前页面无法读取'}}
$('prevImage').onclick=()=>openImage(state.index-1);$('nextImage').onclick=()=>openImage(state.index+1);
})();</script></body></html>
