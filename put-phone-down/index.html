<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050807">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>把手机放下 · 文明实验体</title>
<link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
<div id="app">
  <canvas id="world" aria-label="一个会随着时间生长和衰亡的微缩文明"></canvas>
  <div class="topline">
    <div class="epoch">纪元 <span id="year">0</span></div>
    <div class="mode"><span class="dot"></span><span id="state">冻结</span></div>
  </div>
  <div id="hint" class="hint">轻点世界查看聚落 · 右下角打开控制层</div>
  <button id="menu" class="menuBtn" aria-label="打开控制层">···</button>
  <div id="sheet" class="sheet">
    <div class="grab"></div>
    <div class="stats">
      <div class="stat"><div class="v" id="pop">0</div><div class="k">人口</div></div>
      <div class="stat"><div class="v" id="count">0</div><div class="k">活跃聚落</div></div>
      <div class="stat"><div class="v" id="era">荒原</div><div class="k">文明阶段</div></div>
    </div>
    <div id="selected" class="selected">没有选中任何聚落。世界运行时，你只能观察。</div>
    <div class="actions">
      <button id="put" class="primary">▾ 放下手机</button>
      <button id="pick">△ 拿起手机</button>
      <button id="sensor" class="full">◎ 启用 iPhone 姿态感应</button>
      <button id="reset" class="full">↻ 重建世界</button>
    </div>
    <div id="sensorText" class="sensorState">启用姿态感应后：屏幕朝上平放约 1.5 秒，文明开始流动；拿起后立即冻结。</div>
  </div>
  <div id="toast" class="toast"></div>
</div>
<script src="./app.js?v=2"></script>
</body>
</html>
